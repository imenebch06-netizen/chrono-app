<h2 mat-dialog-title>Assigner un Manager</h2>

    <mat-dialog-content class="p-24 d-flex flex-column gap-16" style="min-width: 380px;">
      <p class="text-muted m-b-12">
        Organisation : <strong class="text-dark">{{ data.orgName }}</strong>
      </p>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Sélectionner un responsable</mat-label>
        <mat-select [(ngModel)]="selectedManagerId">
          <mat-option [value]="null">-- Aucun (Retirer le manager) --</mat-option>
          <mat-option *ngFor="let emp of employesDisponibles" [value]="emp.id">
            {{ emp.prenom }} {{ emp.nom | uppercase }} (#{{ emp.id }})
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="p-16">
      <button mat-button type="button" (click)="dialogRef.close(undefined)">Annuler</button>
      <button mat-flat-button color="primary" [mat-dialog-close]="selectedManagerId">
        Enregistrer
      </button>
    </mat-dialog-actions>
