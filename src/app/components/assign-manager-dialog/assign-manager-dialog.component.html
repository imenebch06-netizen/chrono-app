<h2 mat-dialog-title class="font-bold text-[var(--mat-sys-on-background)]">
  {{ 'ASSIGN_MANAGER_DIALOG.TITLE' | translate }}
</h2>

<mat-dialog-content class="p-24 d-flex flex-column gap-16" style="min-width: 380px;">
  <p class="text-muted m-b-12">
    {{ 'ASSIGN_MANAGER_DIALOG.ORGANIZATION' | translate }} : 
    <strong class="text-dark">{{ data.orgName }}</strong>
  </p>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>{{ 'ASSIGN_MANAGER_DIALOG.SELECT_LABEL' | translate }}</mat-label>
    <mat-select [(ngModel)]="selectedManagerId">
      <mat-option [value]="null">{{ 'ASSIGN_MANAGER_DIALOG.NONE_OPTION' | translate }}</mat-option>
      <mat-option *ngFor="let emp of employesDisponibles" [value]="emp.id">
        {{ emp.prenom }} {{ emp.nom | uppercase }} (#{{ emp.id }})
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="p-16 border-t border-[var(--mat-sys-outline-variant)]">
  <button mat-button type="button" (click)="dialogRef.close(undefined)">
    {{ 'ASSIGN_MANAGER_DIALOG.CANCEL' | translate }}
  </button>
  <button mat-flat-button color="primary" [mat-dialog-close]="selectedManagerId">
    {{ 'ASSIGN_MANAGER_DIALOG.SAVE' | translate }}
  </button>
</mat-dialog-actions>
