
<div class="d-flex align-items-center justify-content-between p-x-24 p-y-16">
  <div class="branding">
    <app-branding></app-branding>
    
  </div>

  @if(showToggle) {
    <a href="javascript:void(0)" (click)="toggleMobileNav.emit()"
       class="d-flex justify-content-center icon-40 align-items-center">
      <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
    </a>
  }
</div>
<!-- Theme + language toggles -->
<div class="d-flex align-items-center justify-content-center gap-8 p-x-24 p-b-16 sidebar-toggles-row">
  <app-theme-toggle></app-theme-toggle>
  <app-lang-toggle></app-lang-toggle>
</div>

<!-- Liste filtrée unique -->
<div class="scroll-sidebar">
  <mat-nav-list class="sidebar-list p-x-16">
    @for (item of navItems; track $index) {
      <app-nav-item 
        [item]="item" 
        (notify)="toggleMobileNav.emit()">
      </app-nav-item>
    }
  </mat-nav-list>
</div>
