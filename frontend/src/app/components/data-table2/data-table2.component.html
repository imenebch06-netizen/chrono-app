<mat-card class="cardWithShadow">
  <mat-card-content class="p-24">

    <div class="table-responsive">
      <table mat-table [dataSource]="orgDataSource" #orgSort="matSort" matSort class="w-100">

        <!-- 1. Colonne ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="f-s-14 f-w-600"> # </th>
          <td mat-cell *matCellDef="let org" class="f-s-14 text-muted">
            #{{ org.id }}
          </td>
        </ng-container>

        <!-- 2. Colonne Nom Organisation -->
        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="f-s-14 f-w-600"> Nom de l'organisation </th>
          <td mat-cell *matCellDef="let org" class="f-s-14 font-semibold text-dark">
            {{ org.nom }}
          </td>
        </ng-container>

        <!-- 3. Colonne Organisation Supérieure (Arborescence) -->
        <ng-container matColumnDef="organizationSup">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="f-s-14 f-w-600"> Org. Supérieure </th>
          <td mat-cell *matCellDef="let org" class="f-s-14">
            <span *ngIf="org.organizationSup || org.idOrganizationSup" 
                  class="bg-light-primary text-primary p-x-8 p-y-4 rounded f-w-600 f-s-12 cursor-pointer"
                  [matTooltip]="getOrgPath(org)"
                  matTooltipPosition="above"
                  matTooltipHideDelay="200">
              {{ org.organizationSup?.nom || ('ID #' + org.idOrganizationSup) }}
            </span>
            <span *ngIf="!org.organizationSup && !org.idOrganizationSup" class="text-muted f-s-12">
              Racine (Aucune)
            </span>
          </td>
        </ng-container>

        <!-- 4. Colonne Manager -->
        <ng-container matColumnDef="manager">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="f-s-14 f-w-600"> Manager </th>
          <td mat-cell *matCellDef="let org" class="f-s-14 text-dark">
            <span *ngIf="org.manager" class="f-w-600 text-dark">
              <mat-icon class="f-s-16 align-middle m-r-4 text-primary">person</mat-icon>
              {{ org.manager.prenom }} {{ org.manager.nom }}
            </span>
           <!-- 2. Si seul le managerId est présent dans l'objet org -->
    <span *ngIf="!org.manager && org.managerId" class="f-w-600 text-dark">
      <mat-icon class="f-s-16 align-middle m-r-4 text-primary">person</mat-icon>
      Manager #{{ org.managerId }}
    </span>

    <!-- 3. Si aucun manager n'est assigné -->
    <span *ngIf="!org.manager && !org.managerId" class="text-muted f-s-12 italic">
      Non assigné
    </span>
          </td>
        </ng-container>

        <!-- 5. Colonne Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-s-14 f-w-600 text-end"> Actions </th>
          <td mat-cell *matCellDef="let org" class="text-end">

            <!-- Manager -->
            <button mat-icon-button class="btn-icon-pure" (click)="assignManager(org)" 
                    [matTooltip]="org.manager || org.managerId ? 'Changer le manager' : 'Assigner un manager'">
              <mat-icon [class.text-primary]="org.manager || org.managerId">manage_accounts</mat-icon>
            </button>

            <!-- Modifier -->
            <button mat-icon-button class="btn-icon-pure" (click)="editOrg(org)" matTooltip="Modifier l'organisation">
              <mat-icon>edit</mat-icon>
            </button>

            <!-- Supprimer -->
            <button mat-icon-button class="btn-icon-pure" (click)="deleteOrg(org)" matTooltip="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedOrgColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedOrgColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell p-24 text-center text-muted" colspan="5">
            Aucune organisation trouvée.
          </td>
        </tr>

      </table>
    </div>

    <!-- Pagination -->
    <mat-paginator 
      #orgPaginator
      [pageSizeOptions]="[5, 10, 20]" 
      showFirstLastButtons 
      aria-label="Sélectionner la page des organisations">
    </mat-paginator>

  </mat-card-content>
</mat-card>
